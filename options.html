<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Standup Logger - Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="options-container">
        <h1>Daily Standup Logger Settings</h1>

        <div class="settings-section">
            <h2>GitHub Configuration</h2>

            <div class="form-group">
                <label for="githubUsername">GitHub Username</label>
                <input type="text" id="githubUsername" placeholder="your-github-username" />
                <small>Your GitHub username for fetching commits</small>
            </div>

            <div class="form-group">
                <label for="githubToken">GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
                <small>
                    Create a token at
                    <a href="https://github.com/settings/tokens?type=beta" target="_blank">GitHub Settings</a>
                    with <code>read:user</code> scope
                </small>
            </div>
        </div>

        <div class="button-group">
            <button id="saveBtn" class="btn btn-success">Save Settings</button>
            <button id="testBtn" class="btn btn-secondary">Test Connection</button>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="settings-section">
            <h2>Other Pages</h2>
            <button id="historyLink" class="btn btn-secondary">View Full History</button>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
