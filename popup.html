<!DOCTYPE html>
<html class="popup-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Standup Logger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
    <div class="popup-container">
        <div class="popup-header">
            <h1>Daily Standup</h1>
            <p class="popup-subtitle">Capture today, plan tomorrow, and keep blockers visible.</p>
        </div>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="form-group input-card">
            <div class="input-card-header">
                <label for="whatDidIDo">What did I do today?</label>
                <p class="input-card-copy">Pull in your GitHub work or refine it manually.</p>
            </div>
            <textarea id="whatDidIDo" placeholder="Generated from GitHub commits..." rows="3"></textarea>
            <button id="generateBtn" class="btn btn-primary">Generate from GitHub</button>
        </div>
        
        <div class="form-group input-card">
            <div class="input-card-header">
                <label for="whatWillIDo">What will I do tomorrow?</label>
                <p class="input-card-copy">Keep it short and outcome-focused.</p>
            </div>
            <textarea id="whatWillIDo" placeholder="Enter your plans for tomorrow..." rows="2"></textarea>
        </div>
        
        <div class="form-group input-card">
            <div class="input-card-header">
                <label for="blockers">Any blockers?</label>
                <p class="input-card-copy">Note anything slowing progress or needing help.</p>
            </div>
            <textarea id="blockers" placeholder="List any blockers or challenges..." rows="2"></textarea>
        </div>
        
        <div class="button-group">
            <button id="saveBtn" class="btn btn-success">Save Entry</button>
            <button id="historyBtn" class="btn btn-secondary">View History</button>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
